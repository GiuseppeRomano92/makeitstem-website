# Written testimonials, shown on testimonials.html (all) and the homepage (first 3),
# in every language. Quotes are shown exactly as the person wrote them, so they
# are not translated.
#
# Fields: name, quote, and either initials (avatar letters) or photo (a file in
# assets/img/). Optional: stars (default 5), lang (language of the quote, default "en").

[[testimonials]]
name = "Yeshwanth N. Rao"
initials = "YR"
quote = """
I had the privilege of learning from Giuseppe during my Master's dissertation on composite materials. \
His approachable nature and openness to discussion make him an exceptional mentor. Before meeting him, \
my knowledge of programming and FEA was very limited and I couldn't see its potential, but his engaging \
teaching style sparked my interest and eventually turned it into a passion. He has a strong grasp of the \
fundamentals and explains concepts in a clear, easily understandable way. With his expertise in \
programming, FEA, and composites, I can confidently vouch for his mentorship — any learner under his \
guidance is truly privileged."""

[[testimonials]]
name = "Yang Yang"
photo = "testimonials/yang-yang.png"
quote = """
During my MSc Aerospace Engineering programme, I was initially quite lost on my dissertation about \
microstructure simulation using Abaqus CAE. That's when I found Dr Romano as a personal tutor for help — \
and the outcome was really positive! Giuseppe not only taught me the academic concepts and modelling \
skills, he also helped me understand the fundamental principles. He isn't someone who just aims to get \
the task done; he tried his best to help me truly understand. I scored the highest in the whole \
engineering faculty. He is patient and easy to get along with. Highly recommend his tutoring — especially \
for any query in modelling, materials or structures."""

[[testimonials]]
